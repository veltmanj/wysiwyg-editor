<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WYSIWYG Editor Demo</title>
  <link rel="stylesheet" href="../src/styles.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f2f5;
      padding: 32px;
    }

    h1 {
      margin-bottom: 8px;
    }

    p.subtitle {
      margin-bottom: 24px;
      color: #555;
    }

    #editor {
      max-width: 900px;
      margin: 0 auto;
    }

    .output {
      max-width: 900px;
      margin: 24px auto 0;
    }

    .output h3 {
      margin-bottom: 8px;
    }

    .output pre {
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 16px;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 13px;
      max-height: 300px;
    }
  </style>
</head>

<body>
  <div style="max-width:900px;margin:0 auto;">
    <h1>WYSIWYG Editor</h1>
    <p class="subtitle">A rich text editor with a fully configurable toolbar.</p>
  </div>
  <div id="editor"></div>

  <div class="output">
    <h3>HTML Output</h3>
    <pre id="html-output">(start typing…)</pre>
  </div>

  <script type="module">
    import { WYSIWYGEditor } from '../src/index.js';

    const editor = new WYSIWYGEditor('#editor', {
      placeholder: 'Start typing your document…',
      onChange(html) {
        document.getElementById('html-output').textContent = html;
      },
    });

    // Expose for console experimentation
    window.editor = editor;
  </script>
</body>

</html>
